# Faolan Gateway — Standardweg: fertiges Image aus der Registry, SQLite, ein Volume.
#
#   cp .env.example .env      # darin FAOLAN_VERSION auf ein veroeffentlichtes Release setzen
#   docker compose up -d
#   curl -fsS http://localhost:8080/healthz
#
# Es wird NICHT lokal gebaut. Wer aus dem Quelltext bauen will, nimmt den Entwicklerpfad dazu:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Fuer PostgreSQL die Override-Datei dazunehmen (startet die DB mit und wartet auf sie):
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# Bewusst ohne Compose-Profile: ein 'depends_on' auf einen nur im Profil aktiven Service
# laesst den Default-Pfad je nach Compose-Version scheitern.

services:
  faolan:
    # KEIN 'latest' — das Tag wird bewusst nicht gesetzt
    # (docs/plans/m1-distribution-contract.md). Welche Version laeuft, steht in .env und
    # nicht in dieser Datei; so aendert ein Upgrade eine Zeile in .env, keine versionierte
    # Datei. FAOLAN_IMAGE ueberschreibt die ganze Referenz und nimmt auch die Digest-Form
    # 'ghcr.io/lupusmalusdeviant/faolan@sha256:...' — der Weg fuer den Produktivbetrieb.
    image: ${FAOLAN_IMAGE:-ghcr.io/lupusmalusdeviant/faolan:${FAOLAN_VERSION:-0.12.0}}
    ports:
      - "${FAOLAN_HTTP_PORT:-8080}:8080"
    volumes:
      - faolan-data:/data
    # Die gesamte Konfiguration des Gateways sind Umgebungsvariablen (siehe docs/operations.md).
    # Sie kommen aus .env — dort stehen auch die geheimen Werte, statt im Klartext in dieser
    # versionierten Datei. .env ist in .gitignore und gehoert auf 0600.
    # 'required: false' haelt den Standardstart ohne .env lauffaehig.
    env_file:
      - path: .env
        required: false
    environment:
      # Nicht ueber .env aenderbar (environment schlaegt env_file): der Container lauscht
      # immer auf 8080, nach aussen verschiebt man den Port ueber FAOLAN_HTTP_PORT.
      ASPNETCORE_URLS: http://+:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dotnet", "Faolan.Server.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # ── Key-Ring-Schutz als Compose-Secrets (optional, siehe docs/operations.md) ──────────
    # PFX UND Passwort gehen als Secret. Das Passwort ueber die Umgebungsvariable zu setzen
    # waere die halbe Miete: Es stuende dann in .env, in 'docker inspect' und in
    # /proc/<pid>/environ — also genau dort, wo ein Secret nicht hingehoert. Deshalb liest
    # der Server jede FAOLAN_*-Einstellung auch aus <NAME>_FILE.
    #
    # Beide Bloecke zusammen einkommentieren und die Dateien vorher anlegen — ein
    # deklariertes, aber fehlendes Secret bricht 'up' ab.
    # In .env dann:
    #   FAOLAN_KEYRING_PROTECTION=file-secret
    #   FAOLAN_KEYRING_CERT_PATH=/run/secrets/faolan-keyring-pfx
    #   FAOLAN_KEYRING_CERT_PASSWORD_FILE=/run/secrets/faolan-keyring-password
    #
    # NICHT beides setzen: Sind FAOLAN_KEYRING_CERT_PASSWORD und ..._FILE gleichzeitig
    # gesetzt, bricht der Start ab. Eine Rangfolge zwischen zwei Quellen desselben Secrets
    # waere eine Regel, die man im Zweifel falsch erinnert.
    # secrets:
    #   - faolan-keyring-pfx
    #   - faolan-keyring-password

# secrets:
#   faolan-keyring-pfx:
#     file: ./secrets/keyring.pfx
#   faolan-keyring-password:
#     file: ./secrets/keyring-password.txt

volumes:
  # ── DER VOLUME-NAME KOMMT AUS FAOLAN_DATA_VOLUME ──────────────────────────────────────────
  # Neuinstallation: nichts setzen, das Volume heisst 'faolan-data'.
  #
  # BESTANDSINSTALLATION (bis 0.12.0, Dienst 'bifrost'): Ihr Volume heisst
  # '<projekt>_bifrost-data'. Genau diesen Namen in .env setzen, sonst haengt Compose ein
  # NEUES, LEERES Volume ein. Der Gateway legt darin eine frische Datenbank an und meldet sich
  # fehlerfrei als bereit: ohne Server, ohne Rollen, ohne Schluessel. Der Ausfall sieht wie ein
  # gelungener Start aus.
  #
  #   docker volume ls --filter name=bifrost-data     # den vollstaendigen Namen ablesen
  #   FAOLAN_DATA_VOLUME=meinprojekt_bifrost-data      # in .env
  #
  # Gemessen (Compose v5.7): Mit gesetztem Namen haengt Compose das bestehende Volume ein, auch
  # wenn es ein anderes Compose-Projekt angelegt hat (dann nur mit einer Warnung). 'external:
  # true' ist dafuer nicht noetig. Mehr in docs/upgrade-faolan.md.
  faolan-data:
    name: ${FAOLAN_DATA_VOLUME:-faolan-data}
