[package]
name = "bifrost-wasi-component-spike"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.94"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
ed25519-dalek = "2.1.1"
# HMAC-SHA256 über die Platten-Kompilate (WP5). RustCrypto wie sha2, teilt dessen digest-Basis;
# `verify_slice` vergleicht in konstanter Zeit. Kein Handbau von HMAC.
hmac = "0.12.1"
# Nur für den 32-Byte-Host-Schlüssel des Caches; liegt ohnehin transitiv im Baum.
getrandom = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
wasmtime = { version = "=47.0.3", default-features = false, features = [
  "anyhow",
  "component-model",
  "cranelift",
  "runtime",
  "std",
  "wat",
] }
wasmtime-wasi = "=47.0.3"
wat = "=1.254.0"
wit-parser = { version = "=0.254.0", default-features = false, features = [
  "decoding",
  "std",
] }
wit-component = { version = "=0.254.0", features = ["dummy-module"] }
