# Override für PostgreSQL statt SQLite:
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# Vor dem ersten Start das Passwort ersetzen — an BEIDEN Stellen.

services:
  bifrost:
    environment:
      BIFROST_DB_PROVIDER: postgres
      BIFROST_DB_CONNECTION: "Host=db;Database=bifrost;Username=bifrost;Password=CHANGE_ME"
    depends_on:
      db:
        # Auf den Healthcheck warten, nicht nur auf den Start: der Gateway legt beim Hochfahren
        # das Schema an und würde gegen eine noch nicht annehmende Datenbank scheitern.
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bifrost
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: CHANGE_ME
    volumes:
      - bifrost-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost -d bifrost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bifrost-pgdata:
