name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Wöchentlicher Lasttest — hält den Benchmark am Leben, statt ihn auf ewig zu überspringen.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build (warnings are errors)
        run: dotnet build --configuration Release

      # ADR-0018: Die Container-Isolation laeuft gegen eine echte Runtime. Das Image vorher holen,
      # damit der Pull nicht in das Zeitlimit des Aufrufs faellt.
      - name: Pull image for the container isolation tests
        if: matrix.os == 'ubuntu-latest'
        run: docker pull alpine:3.20

      - name: Test with coverage
        env:
          # Auf Linux ist Docker da — ein nicht startbarer Postgres-Container ist dort ein
          # echter Fehler und darf nicht zum stillen Skip werden.
          BIFROST_REQUIRE_POSTGRES: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
          # Ebenso fuer die Container-Isolation: Auf Linux ist die Runtime da, ein Skip waere ein
          # stiller Ausfall des Nachweises. Auf Windows fehlen Linux-Container — dort wird
          # uebersprungen, und das Skip-Gate laeuft ohnehin nur auf Linux.
          BIFROST_REQUIRE_CONTAINER: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        # Alle WasiRealHost*-Tests brauchen das gebaute Rust-Binary und laufen deshalb im Job
        # wasi-component-spike (dort mit BIFROST_REQUIRE_WASI_HOST=1, also ohne Skip-Option).
        # Hier ausgeschlossen statt übersprungen: sonst reißt das Skip-Gate unten.
        run: dotnet test --configuration Release --no-build --filter "FullyQualifiedName!~WasiRealHost" --collect:"XPlat Code Coverage" --results-directory ./coverage --logger "trx;LogFileName=results.trx"

      # Der Postgres-Nachweis läuft über Testcontainers und skippt, wenn kein Docker da ist.
      # Auf Ubuntu ist Docker vorhanden — ein Skip bedeutet dort also einen echten Fehler
      # (Image-Pull, Connection-String, Migration) und darf nicht als grün durchgehen.
      - name: Postgres-Nachweis muss auf Linux tatsächlich gelaufen sein
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          SKIPPED=$(grep -o 'outcome="NotExecuted"' coverage/results.trx | wc -l)
          echo "Übersprungene Tests: $SKIPPED"
          # Erlaubt ist genau der Benchmark, der bewusst einen eigenen Job hat.
          if [ "$SKIPPED" -gt 1 ]; then
            echo "::error::$SKIPPED Tests übersprungen — erwartet war höchstens der Benchmark. Postgres-Nachweis vermutlich still ausgefallen."
            grep -o 'testName="[^"]*"[^>]*outcome="NotExecuted"' coverage/results.trx || true
            exit 1
          fi

      # NFR-08 verlangt ≥ 80 % Zeilenabdeckung der Kern-Bibliothek. Ohne Gate ist die Zahl eine
      # Momentaufnahme im Artefakt, die niemand liest — und sie sinkt unbemerkt.
      - name: Coverage-Schwelle Kern-Bibliothek (NFR-08)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          BEST=0
          for f in $(find coverage -name 'coverage.cobertura.xml'); do
            RATE=$(grep -o '<package name="Bifrost.Core" line-rate="[0-9.]*"' "$f" \
                   | grep -o 'line-rate="[0-9.]*"' | grep -o '[0-9.]*' || true)
            if [ -n "$RATE" ]; then
              PCT=$(awk -v r="$RATE" 'BEGIN { printf "%d", r * 10000 }')
              [ "$PCT" -gt "$BEST" ] && BEST=$PCT
            fi
          done
          echo "Bifrost.Core Zeilenabdeckung: $(awk -v b="$BEST" 'BEGIN { printf "%.2f", b / 100 }') %"
          if [ "$BEST" -lt 8000 ]; then
            echo "::error::Zeilenabdeckung von Bifrost.Core unter der NFR-08-Schwelle von 80 %."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage

  benchmark:
    # NFR-01/02: Der Lasttest assertiert die Schwellen (p95 ≤ 50 ms, tools/list p95 ≤ 200 ms).
    # Geteilte Runner sind keine Referenz-Hardware, deshalb kein Gate auf jedem Push — aber er
    # muss regelmäßig laufen, sonst ist er totes Gewicht und die NFRs faktisch ungeprüft.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run load benchmark
        env:
          BIFROST_RUN_BENCHMARK: "1"
        run: dotnet test tests/Bifrost.Integration.Tests --configuration Release --filter "FullyQualifiedName~PerformanceBenchmarkTests" --logger "console;verbosity=detailed"

  wasi-component-spike:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes/wasi-component-runtime
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pinnt Compiler, rustfmt und clippy. Der Spike bleibt
      # absichtlich außerhalb der Server-/Core-Abhängigkeiten.
      - name: Verify pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: WIT discovery and deny-by-default runtime tests
        run: cargo test --locked

      # Plan 0003, WP6.2 + M2: Bis hierhin ist nur die Rust-Seite belegt. Der IPC-Vertrag hat aber
      # zwei Implementierungen — ohne einen Lauf der .NET-Seite gegen dieses Binary bleiben
      # Wire-Kompatibilität und "signiertes Component durch die Governance-Pipeline" Behauptungen,
      # die der Stub-Host in der .NET-Suite nicht trägt.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the host binary the contract tests drive
        run: cargo build --locked --release

      # Getrennte Steps statt zwei Zeilen in einem: auf dem Windows-Runner zählt sonst nur der
      # Exit-Code des letzten Befehls, ein Fehlschlag im ersten ginge unter.
      - name: .NET ↔ Rust-Host — IPC-Vertrag (WP6.2)
        working-directory: ${{ github.workspace }}
        env:
          # Das Binary ist hier garantiert da — ein Skip wäre ein stiller Ausfall des Nachweises.
          BIFROST_REQUIRE_WASI_HOST: "1"
        run: dotnet test tests/Bifrost.Upstream.Tests --configuration Release --filter "FullyQualifiedName~WasiRealHost" --logger "console;verbosity=normal"

      - name: Signiertes Component durch die Governance-Pipeline (M2)
        working-directory: ${{ github.workspace }}
        env:
          BIFROST_REQUIRE_WASI_HOST: "1"
        run: dotnet test tests/Bifrost.Integration.Tests --configuration Release --filter "FullyQualifiedName~WasiRealHost" --logger "console;verbosity=normal"

  isolation-comparison:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/wasi-component-runtime
    steps:
      - uses: actions/checkout@v7

      - name: Verify pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Pull digest-pinned comparison image
        run: docker pull alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1

      - name: Compare short-lived WASI and hardened OCI startup floors
        run: >-
          cargo run --locked --quiet -- compare-container
          alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
          15

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t bifrost:ci .

      # Plan 0003, WP7.1: Der WASI-Host wird MIT ausgeliefert. Ohne diese Prüfung wäre "der
      # Pluginpfad ist deploybar" eine Behauptung — ein fehlendes oder für die falsche
      # Architektur gebautes Binary fiele erst auf, wenn ein Betreiber einen WASI-Upstream anlegt.
      # Der Handshake wird in Python gerahmt: Das Längenpräfix sind vier rohe Bytes, und
      # printf-Escapes verhalten sich je nach Shell unterschiedlich. --entrypoint ist Pflicht,
      # sonst hängt der Befehl am dotnet-Entrypoint des Images.
      - name: WASI-Host liegt im Image und spricht den Vertrag (WP7.1)
        run: |
          # Die Version kommt aus der Quelle, nicht aus diesem Skript. Vorher stand hier eine
          # feste "2"; der Schritt ist beim Sprung auf Vertrag 3 stillschweigend falsch geworden
          # und fiel erst Tage später auf, weil dazwischen nichts gepusht wurde.
          VERSION=$(sed -n 's/^pub const PROTOCOL_VERSION: &str = "\(.*\)";$/\1/p' \
            spikes/wasi-component-runtime/src/host.rs)
          if [ -z "$VERSION" ]; then
            echo "::error::PROTOCOL_VERSION liess sich nicht aus host.rs lesen."
            exit 1
          fi
          echo "Erwartete Vertragsversion: $VERSION"

          ANSWER=$(python3 -c "
          import json,struct,sys
          msg=json.dumps({'id':1,'type':'hello','protocolVersion':'$VERSION'}).encode()
          sys.stdout.buffer.write(struct.pack('>I',len(msg))+msg)" \
            | docker run -i --rm --entrypoint /usr/local/bin/bifrost-wasi-host bifrost:ci host \
            | tr -d '\0')
          echo "Host-Antwort: $ANSWER"

          # Geprüft wird der ganze v4-Handshake: die Korrelations-Id kommt zurück, die Version
          # stimmt, und die Capability-Flags stehen drin (ADR-0016).
          for EXPECTED in '"id":1' "\"protocolVersion\":\"$VERSION\"" '"features"' '"cancellation":true'; do
            case "$ANSWER" in
              *"$EXPECTED"*) ;;
              *) echo "::error::WASI-Host im Image: '$EXPECTED' fehlt in der Handshake-Antwort."; exit 1 ;;
            esac
          done
          echo "Handshake im Image ok (Vertrag $VERSION, mit Korrelations-Id und Capability-Flags)"

      - name: Container läuft non-root (WP7.2)
        run: |
          CONTAINER_UID=$(docker run --rm --entrypoint id bifrost:ci -u)
          echo "Container-UID: $CONTAINER_UID"
          if [ "$CONTAINER_UID" = "0" ]; then
            echo "::error::Der Container läuft als root."
            exit 1
          fi

      # Die Grenze stand auf 300 MB (WP7-DoD) und war fuer ein Image gedacht, das den WASI-Host
      # noch nicht mitbrachte — der Dockerfile-Kommentar nannte damals ~230 MB. Seit ADR-0020 liegt
      # wasmtime mit im Image, und mit v0.6.2 kommen die statischen Blazor-Ressourcen dazu, ohne
      # die die Oberflaeche nicht bedienbar ist. Damit war 300 MB erreicht.
      #
      # Angehoben auf 350 statt abgeschafft: Die Schranke soll Wildwuchs abfangen, nicht jede
      # legitime Ergaenzung anhalten. 50 MB Luft sind genug fuer echten Zuwachs und zu wenig, um
      # ein verdoppeltes Image durchzulassen.
      - name: Verify image size < 350 MB (WP7 DoD, angehoben in v0.6.2)
        run: |
          BYTES=$(docker image inspect bifrost:ci --format '{{.Size}}')
          MB=$((BYTES / 1024 / 1024))
          echo "Image size: ${MB} MB"
          if [ "$MB" -ge 350 ]; then
            echo "::error::Image ${MB} MB überschreitet die 350-MB-Grenze (WP7-DoD)."
            exit 1
          fi

      # NFR-05 verlangt linux/amd64 UND linux/arm64. Ohne echten Build ist das eine Behauptung:
      # der arm64-Zweig kann an nativen Abhängigkeiten (z.B. SQLitePCLRaw) scheitern, ohne dass
      # es auf amd64 auffällt. Nur bauen, nicht laden — Ausführen bräuchte einen arm64-Runner.
      - name: Set up QEMU + buildx (für arm64)
        uses: docker/setup-buildx-action@v4

      - name: Verify linux/arm64 image builds
        run: docker buildx build --platform linux/arm64 -t bifrost:ci-arm64 .

      - name: Compose-Beispiele sind gültig (SQLite-Default und Postgres-Override)
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml config > /dev/null

      - name: Smoke-test container starts and answers /healthz
        run: |
          docker run -d --name bifrost-ci -p 8080:8080 bifrost:ci
          for i in $(seq 1 30); do
            if docker exec bifrost-ci dotnet Bifrost.Server.dll --healthcheck; then
              echo "healthy"; docker rm -f bifrost-ci; exit 0
            fi
            sleep 2
          done
          echo "::error::Container wurde nicht healthy."
          docker logs bifrost-ci
          docker rm -f bifrost-ci
          exit 1
